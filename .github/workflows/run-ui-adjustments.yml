name: Run UI adjustments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-ui-adjustments.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout adjustment branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-dropdown-details-admin-avatar
          fetch-depth: 0

      - name: Apply requested adjustments
        run: python scripts/apply-ui-adjustments.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Commit validated adjustments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ajusta dropdowns, detalhes e avatares"
          git push origin HEAD:fix/mobile-dropdown-details-admin-avatar
