name: Sync runtime hotfix lockfile

on:
  push:
    branches:
      - fix/vercel-node22-runtime

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-node22-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lockfile
        run: npm install

      - name: Verify resolved authentication dependencies
        run: |
          npm ls firebase-admin jwks-rsa jose
          npm audit --audit-level=low

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "chore: sincroniza lockfile do hotfix de autenticação"
            git push origin HEAD:fix/vercel-node22-runtime
          fi
