name: Refresh vulnerable dependencies

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-player-security
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Remove vulnerable or unused packages
        run: npm uninstall react-player video.js @types/video.js webtorrent eslint eslint-config-next

      - name: Upgrade direct dependencies
        run: |
          npm install --save-exact \
            next@15.5.22 \
            firebase-admin@14.2.0 \
            sharp@0.35.3 \
            postcss@8.5.23 \
            axios@1.18.1 \
            hls.js@1.6.16 \
            framer-motion@12.42.2

      - name: Pin patched transitive dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts = {
            ...packageJson.scripts,
            check: 'tsc --noEmit',
          };
          delete packageJson.scripts.lint;
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            postcss: '8.5.23',
            sharp: '0.35.3',
            uuid: '11.1.1',
            gaxios: '7.3.0',
            'retry-request': '8.0.3',
            'teeny-request': '10.1.4',
            'brace-expansion': '2.1.2',
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Require clean audit
        run: npm audit --audit-level=low

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore: refresh secure dependencies"
            git push origin HEAD:fix/tv-player-security
          fi
