name: Refresh vulnerable dependencies

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-player-security
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Remove vulnerable or unused packages
        run: npm uninstall react-player video.js @types/video.js webtorrent eslint eslint-config-next

      - name: Upgrade direct dependencies
        run: |
          npm install --save-exact \
            next@15.5.22 \
            firebase-admin@14.2.0 \
            sharp@0.35.3 \
            postcss@8.5.23 \
            axios@1.18.1 \
            hls.js@1.6.16 \
            framer-motion@12.42.2

      - name: Pin patched transitive dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.scripts = {
            ...packageJson.scripts,
            check: 'tsc --noEmit',
          };
          delete packageJson.scripts.lint;
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            postcss: '8.5.23',
            sharp: '0.35.3',
            uuid: '11.1.1',
            gaxios: '7.3.0',
            'retry-request': '8.0.3',
            'teeny-request': '10.1.4',
            'brace-expansion': '5.0.8',
            glob: '13.0.6',
            minimatch: '10.2.5',
            rimraf: '6.1.3',
            'websocket-driver': '0.7.5',
          };
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          npm install

      - name: Migrate dynamic route parameters
        run: |
          node <<'NODE'
          const fs = require('fs');

          const usersRoute = 'app/api/admin/users/[uid]/route.ts';
          let users = fs.readFileSync(usersRoute, 'utf8');
          users = users.replaceAll(
            '{ params }: { params: { uid: string } },',
            '{ params }: { params: Promise<{ uid: string }> },',
          );
          for (const method of ['GET', 'PATCH', 'DELETE']) {
            const before = `export async function ${method}(\n  request: Request,\n  { params }: { params: Promise<{ uid: string }> },\n) {\n  try {`;
            const after = `${before}\n    const { uid } = await params;`;
            users = users.replace(before, after);
          }
          users = users.replaceAll('params.uid', 'uid');
          fs.writeFileSync(usersRoute, users);

          const detailsPath = 'app/details/[type]/[id]/page.tsx';
          let details = fs.readFileSync(detailsPath, 'utf8');
          details = details.replace(
            '  params: {\n    type: string;\n    id: string;\n  };',
            '  params: Promise<{\n    type: string;\n    id: string;\n  }>;',
          );
          details = details.replace('  const { type, id } = params;', '  const { type, id } = await params;');
          fs.writeFileSync(detailsPath, details);

          const genrePath = 'app/genre/[id]/page.tsx';
          let genre = fs.readFileSync(genrePath, 'utf8');
          genre = genre.replace(
            '  params: {\n    id: string;\n  };\n  searchParams: {\n    type?: string;\n    page?: string;\n  };',
            '  params: Promise<{\n    id: string;\n  }>;\n  searchParams: Promise<{\n    type?: string;\n    page?: string;\n  }>;',
          );
          genre = genre.replace(
            'export default async function GenrePage({ params, searchParams }: PageProps) {\n  // Tratar Aventura separadamente (10759-adventure)',
            'export default async function GenrePage({ params, searchParams }: PageProps) {\n  const resolvedParams = await params;\n  const resolvedSearchParams = await searchParams;\n\n  // Tratar Aventura separadamente (10759-adventure)',
          );
          genre = genre.replaceAll('params.id', 'resolvedParams.id');
          genre = genre.replaceAll('searchParams.type', 'resolvedSearchParams.type');
          genre = genre.replaceAll('searchParams.page', 'resolvedSearchParams.page');
          fs.writeFileSync(genrePath, genre);

          const watchPath = 'app/watch/[type]/[id]/page.tsx';
          let watch = fs.readFileSync(watchPath, 'utf8');
          watch = watch.replace(
            'import { useRouter } from "next/navigation";',
            'import { useParams, useRouter } from "next/navigation";',
          );
          watch = watch.replace(/interface PageProps \{[\s\S]*?\}\n\ntype PlayerType/, 'type PlayerType');
          watch = watch.replace(
            'export default function WatchPage({ params }: PageProps) {\n  const { type, id } = params;',
            'export default function WatchPage() {\n  const params = useParams<{ type: string; id: string }>();\n  const type = params.type;\n  const id = params.id;',
          );
          fs.writeFileSync(watchPath, watch);
          NODE

      - name: Audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(`AUDIT_ITEM package=${name} severity=${item.severity} direct=${item.isDirect} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`);
            for (const via of item.via || []) {
              if (typeof via === 'object') console.log(`  via=${via.source} ${via.title} range=${via.range}`);
            }
          }
          NODE

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Require clean audit
        run: npm audit --audit-level=low

      - name: Commit secure dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/api/admin/users/'[uid]'/route.ts app/details/'[type]'/'[id]'/page.tsx app/genre/'[id]'/page.tsx app/watch/'[type]'/'[id]'/page.tsx tsconfig.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore: refresh secure dependencies"
            git push origin HEAD:fix/tv-player-security
          fi
